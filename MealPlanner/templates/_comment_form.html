{% if current_user %}
<form
    method="post"
    action="{{ url_for('recipe_comment_add', recipe_id=r.recipe_id) }}"
>
    <div class="form-group">
        <label>Add a comment</label>
        <textarea
            class="form-control"
            name="body"
            rows="3"
            required
            placeholder="Share your thoughts on this recipe..."
        ></textarea>
    </div>
    <button class="btn btn-primary" type="submit">Post Comment</button>
</form>
{% else %}
<p><a href="{{ url_for('auth_page') }}">Log in</a> to comment.</p>
{% endif %}
